<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uzinfocom Loader — demo</title>
<style>
  body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#fff;color:#10123a;display:grid;place-items:center;min-height:100vh;gap:32px}
  .row{display:flex;gap:40px;align-items:center;flex-wrap:wrap;justify-content:center}
  .dark{background:#4C51C6;padding:24px;border-radius:16px}
</style>
<script type="module" src="../src/element.js"></script>
</head>
<body>
  <div class="row">
    <uic-loader size="24"></uic-loader>
    <uic-loader></uic-loader>
    <uic-loader size="96"></uic-loader>
    <uic-loader size="160"></uic-loader>
    <div class="dark"><uic-loader size="64" color="#fff"></uic-loader></div>
  </div>
  <p>Запуск: <code>npx serve .</code> из корня пакета, затем открыть <code>/demo/</code></p>
</body>
</html>
